<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creacy — Cinematic Photography Studio</title>
  <meta name="description" content="Creacy is an independent photography studio for landscape, architecture, wildlife, travel and portrait work. Demonstration portfolio.">
  <meta name="theme-color" content="#1c191f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" as="image" href="img/meadow-house-sm.jpg" imagesrcset="img/meadow-house-sm.jpg 960w, img/meadow-house.jpg 1920w" imagesizes="100vw">
</head>
<body>
  <a class="skip" href="#main" data-skip>Skip to content</a>

  <header class="header" data-header>
    <div class="header__inner">
      <a class="logo" href="#home" aria-label="Creacy home" data-logo></a>
      <nav class="nav" aria-label="Primary" data-nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Service</a>
        <a href="#portfolio">Projects</a>
        <a href="#journal">Journal</a>
        <a href="#contact">Contact Us</a>
      </nav>
      <div class="header__cta">
        <a class="btn btn--solid btn--sm" href="#booking" data-magnetic><span class="btn__text">Book a call</span><span class="btn__icon" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6)" data-arrow></span></a>
        <button class="burger" aria-label="Open menu" aria-expanded="false" aria-controls="menu" data-burger></button>
      </div>
    </div>
  </header>

  <div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Site menu" data-menu>
    <div class="menu__top"><a class="logo" href="#home" data-logo></a><button class="circle" aria-label="Close menu" data-menu-close></button></div>
    <nav class="menu__links" aria-label="Mobile">
      <a href="#home"><span>01</span>Home</a>
      <a href="#about"><span>02</span>About</a>
      <a href="#portfolio"><span>03</span>Projects</a>
      <a href="#categories"><span>04</span>Categories</a>
      <a href="#series"><span>05</span>Series</a>
      <a href="#services"><span>06</span>Services</a>
      <a href="#awards"><span>07</span>Awards</a>
      <a href="#journal"><span>08</span>Journal</a>
      <a href="#contact"><span>09</span>Contact</a>
    </nav>
    <div class="menu__foot"><a class="btn btn--solid" href="#booking"><span class="btn__text">Book a shoot</span><span class="btn__icon" data-arrow></span></a><span class="micro">creacy@hello.com</span></div>
  </div>

  <main id="main" tabindex="-1" data-view></main>

  <div class="lb" role="dialog" aria-modal="true" aria-label="Image viewer" aria-hidden="true" data-lb-root>
    <div class="lb__bg" data-lb-close data-cursor="close"></div>
    <div class="lb__top"><span class="lb__count" data-lb-count>01 / 01</span><button class="circle" aria-label="Close viewer" data-lb-close data-lb-closebtn></button></div>
    <div class="lb__stage" data-lb-stage>
      <img class="lb__img" alt="" data-lb-img>
      <div class="lb__nav lb__nav--prev"><button class="circle" aria-label="Previous image" data-lb-prev data-cursor="prev"></button></div>
      <div class="lb__nav lb__nav--next"><button class="circle" aria-label="Next image" data-lb-next data-cursor="next"></button></div>
    </div>
    <div class="lb__bottom"><div class="lb__cap"><strong data-lb-title></strong><span data-lb-sub></span></div><div class="lb__thumbs" data-lb-thumbs></div></div>
  </div>

  <div class="cursor is-hidden" aria-hidden="true" data-cursor-el><div class="cursor__ring"><span class="cursor__label" data-cursor-label></span></div><div class="cursor__dot"></div></div>
  <div class="sbar" aria-hidden="true" data-sbar><div class="sbar__track"></div><div class="sbar__thumb" data-sbar-thumb></div></div>
  <div class="curtain" aria-hidden="true" data-curtain><span data-curtain-label>Creacy</span></div>
  <div class="toast" role="status" aria-live="polite" data-toast></div>

  <!-- Motion libraries (loaded from CDNs; the site still works if they are unavailable) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="img-manifest.js"></script>
  <script src="data.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
